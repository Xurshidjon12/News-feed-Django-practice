{% extends 'news/base.html' %}
{% load static %}


{% block title %}Texnalogiya Xabarlar{% endblock %}

{% block content %}

    <h1> Texnalogiya Xabarlar </h1>

    {% for news in texnalogiya_yangiliklar %}
       <div class="container">
       <div class="row">
           <div class="col-md-8">
               <a href="{{news.get_absolute_url }}">
               <img src="{{ news.image.url }}" alt="{{ news.title }}" style="width: 50%;">
               <h2>{{ news.title }}</h2>
               </a>
           </div>
        </div>    
               
       </div>
    {% endfor %}

{% endblock content %}
